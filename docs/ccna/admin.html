<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRACER 관리자</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23146C63'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h16' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<style>
  /* 관리자 화면: TRACER와 같은 색. 기본은 어두운 화면. */
  :root {
    --bg: #0E1413; --panel: #151D1B; --sunk: #1C2624; --ink: #E5EDEA; --ink-2: #A6B4B0; --ink-3: #788683; --rule: #26322F;
    --accent: #5FC7B8; --accent-soft: #15302C; --ok: #7BD49C; --ok-soft: #16301F; --bad: #F08C78; --bad-soft: #3A1C17;
    --part: #E8B04A; --part-soft: #33260F; --bank: #8FB3F0;
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #F3F5F4; --panel: #FFFFFF; --sunk: #E8ECEA; --ink: #121A18; --ink-2: #4B5856; --ink-3: #7D8A88; --rule: #D8DFDC;
    --accent: #146C63; --accent-soft: #DDEFEC; --ok: #1F7A45; --ok-soft: #DDF1E4; --bad: #B4402C; --bad-soft: #F8E2DC;
    --part: #A0660F; --part-soft: #F6EAD3; --bank: #2F5FB3; color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14.5px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .mono { font-family: var(--mono); }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
  .bar { max-width: 1240px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; white-space: nowrap; }
  .logo .mk { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
  .logo small { font-family: var(--mono); font-weight: 500; color: var(--ink-3); font-size: 12px; }
  .tabs { display: flex; gap: 2px; margin-left: 8px; overflow-x: auto; }
  .tabs button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .spacer { flex: 1; }
  .who { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  a.back { font-size: 13.5px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
  .icon-btn { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink-2); cursor: pointer; flex: none; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; }
  .muted { color: var(--ink-3); }
  .btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 3px 9px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: default; }
  select { max-width: 100%; }
  input[type=text], input[type=search], input[type=number], select, textarea { background: var(--sunk); border: 1px solid var(--rule); border-radius: 9px; padding: 6px 10px; }
  textarea { width: 100%; min-height: 70px; resize: vertical; }
  .gate { max-width: 460px; margin: 60px auto; text-align: center; display: grid; gap: 14px; }

  /* 대시보드 */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; }
  .tile .k { font-size: 12.5px; color: var(--ink-3); }
  .tile .v { font-family: var(--mono); font-size: 26px; font-weight: 600; line-height: 1.3; }
  .tile .s { font-size: 12.5px; color: var(--ink-2); }
  .tile .meter { height: 6px; border-radius: 3px; background: var(--sunk); margin-top: 8px; overflow: hidden; }
  .tile .meter i { display: block; height: 100%; background: var(--accent); }
  .tile.warn .v { color: var(--part); }
  .days { display: grid; gap: 4px; }
  .day { display: grid; grid-template-columns: 56px 1fr 190px; gap: 10px; align-items: center; font-size: 13px; }
  .day .bars { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--sunk); }
  .day .bars i { display: block; height: 100%; }
  .day .bars .b { background: var(--bank); } .day .bars .n { background: var(--part); }
  .day .nums { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin: 4px 0 10px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }

  /* 표 */
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 14px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: middle; white-space: nowrap; }
  th { font-size: 12px; color: var(--ink-3); font-weight: 600; background: var(--sunk); position: sticky; top: 0; }
  tr:last-child td { border-bottom: 0; }
  td .em { font-size: 12.5px; color: var(--ink-3); }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); }
  .pill.owner { background: var(--accent-soft); color: var(--accent); }
  .pill.admin { background: var(--accent-soft); color: var(--accent); }
  .pill.active { background: var(--ok-soft); color: var(--ok); }
  .pill.blocked, .pill.flagged { background: var(--bad-soft); color: var(--bad); }
  .pill.pending, .pill.hidden { background: var(--part-soft); color: var(--part); }
  .pill.ai { background: var(--part-soft); color: var(--part); }
  .pill.bank { background: color-mix(in srgb, var(--bank) 18%, transparent); color: var(--bank); }
  .sw { position: relative; display: inline-block; width: 34px; height: 20px; vertical-align: middle; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw span { position: absolute; inset: 0; background: var(--sunk); border: 1px solid var(--rule); border-radius: 999px; cursor: pointer; transition: .15s; }
  .sw span::after { content: ""; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; border-radius: 50%; background: var(--ink-3); transition: .15s; }
  .sw input:checked + span { background: var(--accent-soft); border-color: var(--accent); }
  .sw input:checked + span::after { transform: translateX(14px); background: var(--accent); }
  .sw input:disabled + span { opacity: .4; cursor: default; }
  .lim { width: 64px; }

  /* 문제은행 */
  .qlist { display: grid; gap: 12px; }
  .qc { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; }
  .qc.flagged { border-color: var(--bad); }
  .qc .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
  .qc .qt { white-space: pre-wrap; font-size: 14px; }
  .qc ol { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 3px; font-size: 13.5px; }
  .qc ol li { padding: 4px 8px; border-radius: 8px; background: var(--sunk); }
  .qc ol li.right { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
  .qc ol li .nt { display: block; font-weight: 400; color: var(--ink-2); font-size: 12.5px; }
  .qc .ex { font-size: 13.5px; color: var(--ink-2); }
  .qc .rs { font-size: 13px; background: var(--bad-soft); color: var(--bad); padding: 6px 10px; border-radius: 9px; }
  .qc .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .qc .stat { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-left: auto; }
  .qc .edit { display: grid; gap: 6px; }
  .qc .edit label { font-size: 12.5px; color: var(--ink-3); display: grid; gap: 3px; }
  .buckets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; font-size: 12.5px; }
  .bk { background: var(--sunk); border-radius: 8px; padding: 5px 8px; display: grid; gap: 3px; }
  .bk .m { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
  .bk .m i { display: block; height: 100%; background: var(--bank); }

  /* 활동 */
  .act td.d { white-space: normal; min-width: 200px; color: var(--ink-2); font-size: 12.5px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); }
  @media (max-width: 760px) {
    .bar { height: auto; flex-wrap: wrap; padding: 8px 16px; gap: 8px; }
    .tabs { order: 3; width: 100%; margin-left: 0; }
    .who { display: none; }
    .day { grid-template-columns: 52px 1fr; } .day .nums { grid-column: 1 / -1; text-align: left; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><span class="mk" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg></span>TRACER <small>관리자</small></div>
    <nav class="tabs" role="tablist" aria-label="관리 메뉴" id="tabs" hidden>
      <button role="tab" aria-selected="true" data-tab="dash">대시보드</button>
      <button role="tab" aria-selected="false" data-tab="users">사용자</button>
      <button role="tab" aria-selected="false" data-tab="activity">활동 기록</button>
      <button role="tab" aria-selected="false" data-tab="bank">문제은행</button>
    </nav>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="btn sm" id="logoutBtn" type="button" hidden>로그아웃</button>
    <a class="back" href="app.html">← TRACER</a>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="밝은 화면으로 전환">◐</button>
  </div>
</header>
<main>
  <div class="gate" id="gate">
    <p id="gateMsg" class="muted">확인 중…</p>
    <div><button class="btn primary" id="loginBtn" type="button" hidden>Google로 로그인</button></div>
  </div>

  <section id="v-dash" hidden>
    <div class="tiles" id="tiles"></div>
    <div class="panel">
      <h2>최근 14일</h2>
      <div class="legend"><span style="--c: var(--bank)">문제은행 출제(AI 0번)</span><span style="--c: var(--part)">새로 만든 문제(AI 1번)</span></div>
      <div class="days" id="days"></div>
    </div>
  </section>

  <section id="v-users" hidden>
    <div class="tools">
      <input type="search" id="uSearch" placeholder="이름·이메일 검색" aria-label="사용자 검색">
      <select id="uStatus" aria-label="상태로 거르기"><option value="">모든 상태</option><option value="active">사용 중</option><option value="pending">승인 대기</option><option value="blocked">차단</option></select>
      <span class="muted" id="uCount"></span>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>사용자</th><th>역할</th><th>상태</th><th>마지막 접속</th><th>오늘 AI</th><th>하루 한도</th><th>AI 문제</th><th>내 문제 해설</th><th>푼 문제</th><th></th></tr></thead>
      <tbody id="uRows"></tbody>
    </table></div>
    <p class="muted" style="font-size:12.5px">권한을 끄면 그 기능의 AI 요청이 즉시 막혀요(서브넷 계산은 로그인 없이 누구나 가능). 차단하면 모든 AI 기능이 막히고, 관리자 지정은 주인만 할 수 있어요.</p>
  </section>

  <section id="v-activity" hidden>
    <div class="tools">
      <select id="aUser" aria-label="사용자"><option value="">모든 사용자</option></select>
      <select id="aAction" aria-label="행동">
        <option value="">모든 행동</option><option value="visit">접속</option><option value="signup">가입</option><option value="question">문제 받기</option>
        <option value="grade">채점</option><option value="subnet">서브넷 풀이</option><option value="explain">내 문제 해설</option><option value="report">문제 신고</option><option value="admin">관리자 작업</option>
      </select>
      <select id="aDays" aria-label="기간"><option value="1">오늘·어제</option><option value="7" selected>7일</option><option value="30">30일</option><option value="90">90일</option></select>
      <span class="muted" id="aCount"></span>
    </div>
    <div class="tablewrap"><table class="act">
      <thead><tr><th>시각</th><th>사용자</th><th>행동</th><th>내용</th><th>기기</th></tr></thead>
      <tbody id="aRows"></tbody>
    </table></div>
  </section>

  <section id="v-bank" hidden>
    <div class="panel" style="margin-bottom:14px">
      <h2>묶음별 문제 수 <span class="muted" id="bkNote" style="font-weight:400;font-size:12.5px"></span></h2>
      <div class="buckets" id="buckets"></div>
    </div>
    <div class="tools">
      <select id="qStatus" aria-label="상태"><option value="flagged">출제 중지(신고 누적)</option><option value="">전체</option><option value="active">출제 중</option><option value="hidden">숨김</option></select>
      <select id="qSub" aria-label="범위"><option value="">모든 범위</option></select>
      <label class="muted" style="font-size:13px"><input type="checkbox" id="qLow"> 정답률 낮은 문제(정답 키 오류 의심)</label>
    </div>
    <div class="qlist" id="qList"></div>
  </section>
</main>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m) { var t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 3500); }
  function when(iso) {
    if (!iso) return '–';
    var d = new Date(iso), diff = (Date.now() - d) / 1000;
    if (diff < 60) return '방금'; if (diff < 3600) return Math.floor(diff / 60) + '분 전'; if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function stamp(iso) { var d = new Date(iso); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0'); }

  // 테마: 기본 어둡게
  var root = document.documentElement;
  try { if (localStorage.getItem('ccna-admin-theme') === 'light') root.setAttribute('data-theme', 'light'); } catch (e) {}
  $('#themeBtn').addEventListener('click', function () {
    var light = root.getAttribute('data-theme') === 'light';
    light ? root.removeAttribute('data-theme') : root.setAttribute('data-theme', 'light');
    try { localStorage.setItem('ccna-admin-theme', light ? 'dark' : 'light'); } catch (e) {}
  });

  var sb = null, me = null, topics = [], users = [];
  function api(path, body) {
    return sb.auth.getSession().then(function (r) {
      var t = r.data.session && r.data.session.access_token, h = { 'Content-Type': 'application/json' };
      if (t) h.Authorization = 'Bearer ' + t;
      return fetch(path, body ? { method: 'POST', headers: h, body: JSON.stringify(body) } : { headers: h });
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || '요청 실패'); return j; }); });
  }
  function gate(msg, login) { $('#gate').hidden = false; $('#gateMsg').textContent = msg; $('#loginBtn').hidden = !login; }

  // 탭
  var loaded = {};
  function show(tab) {
    document.querySelectorAll('#tabs [role=tab]').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false'); });
    ['dash', 'users', 'activity', 'bank'].forEach(function (t) { $('#v-' + t).hidden = t !== tab; });
    ({ dash: loadDash, users: loadUsers, activity: loadActivity, bank: loadBank })[tab]();
    try { history.replaceState(null, '', '#' + tab); } catch (e) {}
  }
  $('#tabs').addEventListener('click', function (e) { var b = e.target.closest('[role=tab]'); if (b) show(b.dataset.tab); });

  // ---- 대시보드
  function loadDash() {
    api('/api/admin/summary').then(function (s) {
      var pct = s.global_daily_ai ? Math.min(100, Math.round(s.today_counted / s.global_daily_ai * 100)) : 0;
      var served = s.daily.reduce(function (a, d) { return a + d.bank_serves + d.new_questions; }, 0);
      var bank = s.daily.reduce(function (a, d) { return a + d.bank_serves; }, 0);
      var tile = function (k, v, sub, extra, cls) { return '<div class="tile' + (cls ? ' ' + cls : '') + '"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + sub + '</div>' + (extra || '') + '</div>'; };
      $('#tiles').innerHTML =
        tile('사용자', s.users, (s.pending ? '승인 대기 ' + s.pending + ' · ' : '') + '차단 ' + s.blocked) +
        tile('오늘 제미나이 호출', s.today_ai, '전체 한도 ' + s.today_counted + ' / ' + s.global_daily_ai + ' (주인 제외)', '<div class="meter"><i style="width:' + pct + '%"></i></div>', pct >= 80 ? 'warn' : '') +
        tile('문제은행', s.bank_active, '묶음당 ' + s.bank_min + '개부터 ' + Math.round(s.bank_ratio * 100) + '% 재사용') +
        tile('14일 재사용 비율', served ? Math.round(bank / served * 100) + '%' : '–', '출제 ' + served + '번 중 ' + bank + '번은 AI 없이') +
        tile('확인 필요', s.bank_flagged, '출제 중지 문제 · 미해결 신고 ' + s.open_reports, '', s.bank_flagged ? 'warn' : '');
      var max = Math.max.apply(null, s.daily.map(function (d) { return d.bank_serves + d.new_questions; }).concat([1]));
      $('#days').innerHTML = s.daily.slice().reverse().map(function (d) {
        var b = d.bank_serves / max * 100, n = d.new_questions / max * 100;
        return '<div class="day"><span class="mono">' + esc(String(d.day).slice(5).replace('-', '/')) + '</span>' +
          '<span class="bars" title="문제은행 ' + d.bank_serves + ' · 새 문제 ' + d.new_questions + '"><i class="b" style="width:' + b + '%"></i><i class="n" style="width:' + n + '%"></i></span>' +
          '<span class="nums">접속 ' + d.visitors + '명 · AI ' + d.ai_calls + ' · 채점 ' + d.answers + '</span></div>';
      }).join('');
    }).catch(function (e) { toast(e.message); });
  }

  // ---- 사용자
  var ROLE = { owner: '주인', admin: '관리자', user: '사용자' }, STATUS = { active: '사용 중', pending: '승인 대기', blocked: '차단' };
  function loadUsers() {
    return api('/api/admin/users').then(function (rows) { users = rows; renderUsers(); fillUserSelect(); }).catch(function (e) { toast(e.message); });
  }
  function canEdit(u) { return u.role !== 'owner' && (me.role === 'owner' || u.role === 'user') && u.id !== me.id; }
  function renderUsers() {
    var q = $('#uSearch').value.trim().toLowerCase(), st = $('#uStatus').value;
    var rows = users.filter(function (u) { return (!q || (u.email + ' ' + (u.name || '')).toLowerCase().indexOf(q) >= 0) && (!st || u.status === st); });
    $('#uCount').textContent = rows.length + '명';
    $('#uRows').innerHTML = rows.map(function (u) {
      var ed = canEdit(u), dis = ed ? '' : ' disabled';
      var sw = function (f) { return '<label class="sw"><input type="checkbox" data-f="' + f + '"' + (u[f] ? ' checked' : '') + dis + ' aria-label="' + f + '"><span></span></label>'; };
      var acts = [];
      if (ed) {
        if (u.status === 'pending') acts.push('<button class="btn sm primary" data-set="status:active">승인</button>');
        acts.push(u.status === 'blocked' ? '<button class="btn sm" data-set="status:active">차단 해제</button>' : '<button class="btn sm danger" data-set="status:blocked">차단</button>');
        if (me.role === 'owner') acts.push(u.role === 'admin' ? '<button class="btn sm" data-set="role:user">관리자 해제</button>' : '<button class="btn sm" data-set="role:admin">관리자 지정</button>');
      }
      acts.push('<button class="btn sm" data-log="' + u.id + '">활동</button>');
      return '<tr data-id="' + u.id + '"><td><b>' + esc(u.name || '(이름 없음)') + '</b><br><span class="em">' + esc(u.email) + '</span></td>' +
        '<td><span class="pill ' + u.role + '">' + ROLE[u.role] + '</span></td><td><span class="pill ' + u.status + '">' + STATUS[u.status] + '</span></td>' +
        '<td title="' + esc(u.last_seen || '') + '">' + when(u.last_seen) + '<br><span class="em">가입 ' + when(u.created_at) + '</span></td>' +
        '<td class="mono">' + u.today_ai + '</td>' +
        '<td>' + (u.role === 'owner' ? '<span class="muted">제한 없음</span>' : '<input class="lim" type="number" min="0" max="1000" value="' + u.daily_limit + '"' + dis + ' aria-label="하루 한도">') + '</td>' +
        '<td>' + sw('can_practice') + '</td><td>' + sw('can_explain') + '</td><td class="mono">' + u.total_attempts + '</td>' +
        '<td>' + acts.join(' ') + '</td></tr>';
    }).join('') || '<tr><td colspan="10" class="muted">사용자가 없어요.</td></tr>';
  }
  function setUser(id, fields) {
    return api('/api/admin/user', Object.assign({ id: id }, fields)).then(function (u) {
      var i = users.findIndex(function (x) { return x.id === id; }); if (i >= 0) Object.assign(users[i], u);
      renderUsers(); toast('저장했어요.');
    }).catch(function (e) { toast(e.message); renderUsers(); });
  }
  $('#uRows').addEventListener('change', function (e) {
    var tr = e.target.closest('tr'); if (!tr) return;
    if (e.target.dataset.f) setUser(tr.dataset.id, (function (o) { o[e.target.dataset.f] = e.target.checked; return o; })({}));
    else if (e.target.classList.contains('lim')) setUser(tr.dataset.id, { daily_limit: +e.target.value || 0 });
  });
  $('#uRows').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; var tr = b.closest('tr');
    if (b.dataset.log) { $('#aUser').value = b.dataset.log; show('activity'); return; }
    var kv = b.dataset.set.split(':'), u = users.find(function (x) { return x.id === tr.dataset.id; });
    if (kv[1] === 'blocked' && !confirm((u.name || u.email) + ' 계정을 차단할까요? AI 기능을 모두 쓸 수 없게 돼요.')) return;
    setUser(tr.dataset.id, (function (o) { o[kv[0]] = kv[1]; return o; })({}));
  });
  $('#uSearch').addEventListener('input', renderUsers); $('#uStatus').addEventListener('change', renderUsers);

  // ---- 활동 기록
  var ACT = { visit: '접속', signup: '가입', question: '문제 받기', grade: '채점', subnet: '서브넷 풀이', explain: '내 문제 해설', report: '문제 신고', admin: '관리자 작업' };
  function fillUserSelect() {
    var cur = $('#aUser').value;
    $('#aUser').innerHTML = '<option value="">모든 사용자</option>' + users.map(function (u) { return '<option value="' + u.id + '">' + esc(u.name || u.email) + '</option>'; }).join('');
    $('#aUser').value = cur;
  }
  function detailText(a) {
    var d = a.detail || {};
    if (a.action === 'question') return (d.sub || '') + ' · ' + (d.difficulty || '') + ' · ' + ({ mcq: '객관식', short: '주관식' }[d.qtype] || '') + (d.source === 'bank' ? ' · 문제은행' : ' · 새로 생성') + (d.bucket != null ? ' (묶음 ' + d.bucket + '개)' : '');
    if (a.action === 'grade') return (d.sub || '') + ' · ' + ({ mcq: '객관식', short: '주관식' }[d.qtype] || '') + ' · ' + (d.verdict || '');
    if (a.action === 'subnet') return d.verdict || '';
    if (a.action === 'explain') return d.sub ? '범위 ' + d.sub : '범위 지정 안 함';
    if (a.action === 'report') return '"' + (d.reason || '') + '"';
    if (a.action === 'admin') return d.email ? d.email + ' → ' + JSON.stringify(d.set) : '문제 ' + String(d.qid || '').slice(0, 8) + ' 수정 (' + (d.set || []).join(', ') + ')';
    return '';
  }
  function loadActivity() {
    if (!users.length) loadUsers();
    var p = new URLSearchParams({ days: $('#aDays').value, user: $('#aUser').value, action: $('#aAction').value, limit: '500' });
    api('/api/admin/activity?' + p).then(function (rows) {
      $('#aCount').textContent = rows.length + '건' + (rows.length >= 500 ? ' (최근 500건)' : '');
      $('#aRows').innerHTML = rows.map(function (a) {
        var u = a.profiles || {};
        return '<tr><td class="mono" style="font-size:12.5px">' + stamp(a.at) + '</td><td>' + esc(u.name || u.email || '–') + '</td>' +
          '<td>' + (ACT[a.action] || esc(a.action)) + (a.ai ? ' <span class="pill ai">AI</span>' : a.action === 'question' && a.detail && a.detail.source === 'bank' ? ' <span class="pill bank">은행</span>' : '') + '</td>' +
          '<td class="d">' + esc(detailText(a)) + '</td><td class="em">' + esc(a.device || '') + '</td></tr>';
      }).join('') || '<tr><td colspan="5" class="muted">기록이 없어요.</td></tr>';
    }).catch(function (e) { toast(e.message); });
  }
  ['#aUser', '#aAction', '#aDays'].forEach(function (s) { $(s).addEventListener('change', loadActivity); });

  // ---- 문제은행
  var qs = [];
  function loadBank() {
    var p = new URLSearchParams({ status: $('#qLow').checked ? '' : $('#qStatus').value, sub: $('#qSub').value, low: $('#qLow').checked ? '1' : '' });
    api('/api/admin/questions?' + p).then(function (r) {
      qs = r.questions; renderQs();
      var target = r.bank_min || 30;
      $('#bkNote').textContent = '· 출제 중 문제가 ' + target + '개 이상인 묶음부터 재사용';
      $('#buckets').innerHTML = r.buckets.map(function (b) {
        return '<div class="bk"><span><b class="mono">' + esc(b.sub) + '</b> ' + esc(b.difficulty) + ' · ' + (b.qtype === 'mcq' ? '객관식' : '주관식') + '</span>' +
          '<span class="mono">' + b.active + ' / ' + target + (b.flagged ? ' · 중지 ' + b.flagged : '') + (b.hidden ? ' · 숨김 ' + b.hidden : '') + '</span>' +
          '<span class="m"><i style="width:' + Math.min(100, b.active / target * 100) + '%"></i></span></div>';
      }).join('') || '<span class="muted">아직 저장된 문제가 없어요. 사용자들이 문제를 받으면 쌓여요.</span>';
    }).catch(function (e) { toast(e.message); });
  }
  var QST = { active: '출제 중', flagged: '출제 중지', hidden: '숨김' };
  function renderQs() {
    $('#qList').innerHTML = qs.map(function (q, i) {
      var rate = q.graded ? Math.round(q.correct / q.graded * 100) + '%' : '–';
      var opts = (q.choices || []).map(function (c, k) {
        var L = 'ABCD'[k], note = (q.option_notes || [])[k];
        return '<li class="' + (L === q.answer ? 'right' : '') + '">' + L + '. ' + esc(c) + (note ? '<span class="nt">' + esc(note) + '</span>' : '') + '</li>';
      }).join('');
      var acts = [];
      if (q.status !== 'active' || q.reports) acts.push('<button class="btn sm primary" data-a="resolve">검토 완료 · 다시 출제</button>');
      if (q.status !== 'hidden') acts.push('<button class="btn sm danger" data-a="hide">숨기기</button>');
      acts.push('<button class="btn sm" data-a="edit">고치기</button>');
      return '<article class="qc ' + q.status + '" data-i="' + i + '"><div class="meta"><span class="pill ' + q.status + '">' + QST[q.status] + '</span><span class="pill">' + esc(q.sub) + '</span><span class="pill">' + esc(q.difficulty) + '</span><span class="pill">' + (q.qtype === 'mcq' ? '객관식' : '주관식') + '</span>' +
        '<span class="stat">출제 ' + q.served + ' · 채점 ' + q.graded + ' · 정답률 ' + rate + ' · 신고 ' + q.reports + '</span></div>' +
        '<div class="qt">' + esc(q.question) + '</div>' + (opts ? '<ol>' + opts + '</ol>' : '<div class="ex"><b>모범 답안</b> ' + esc(q.answer) + '</div>') +
        (q.explanation ? '<div class="ex">' + esc(q.explanation) + '</div>' : '') +
        (q.report_reasons && q.report_reasons.length ? '<div class="rs">신고: ' + q.report_reasons.map(esc).join(' / ') + '</div>' : '') +
        '<div class="acts">' + acts.join('') + '</div><div class="edit" hidden></div></article>';
    }).join('') || '<p class="muted">해당하는 문제가 없어요.</p>';
  }
  function saveQ(i, fields, msg) {
    return api('/api/admin/question', Object.assign({ id: qs[i].id }, fields)).then(function (q) { Object.assign(qs[i], q, { report_reasons: fields.resolve ? [] : qs[i].report_reasons }); renderQs(); toast(msg || '저장했어요.'); })
      .catch(function (e) { toast(e.message); });
  }
  $('#qList').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; var card = b.closest('.qc'), i = +card.dataset.i, q = qs[i];
    if (b.dataset.a === 'resolve') saveQ(i, { resolve: true }, '다시 출제해요.');
    if (b.dataset.a === 'hide') saveQ(i, { status: 'hidden' }, '숨겼어요. 더 이상 출제되지 않아요.');
    if (b.dataset.a === 'edit') {
      var ed = card.querySelector('.edit'); ed.hidden = !ed.hidden; if (ed.hidden) return;
      ed.innerHTML = '<label>문제<textarea data-k="question">' + esc(q.question) + '</textarea></label>' +
        (q.qtype === 'mcq' ? [0, 1, 2, 3].map(function (k) { return '<label>보기 ' + 'ABCD'[k] + '<input type="text" data-c="' + k + '" value="' + esc((q.choices || [])[k]) + '"></label>'; }).join('') +
          '<label>정답<select data-k="answer">' + 'ABCD'.split('').map(function (L) { return '<option' + (L === q.answer ? ' selected' : '') + '>' + L + '</option>'; }).join('') + '</select></label>' +
          [0, 1, 2, 3].map(function (k) { return '<label>보기 ' + 'ABCD'[k] + ' 해설<input type="text" data-n="' + k + '" value="' + esc((q.option_notes || [])[k]) + '"></label>'; }).join('')
          : '<label>모범 답안<input type="text" data-k="answer" value="' + esc(q.answer) + '"></label>') +
        '<label>해설<textarea data-k="explanation">' + esc(q.explanation) + '</textarea></label>' +
        '<div class="acts"><button class="btn sm primary" data-a="save">저장</button><button class="btn sm" data-a="edit">취소</button></div>';
    }
    if (b.dataset.a === 'save') {
      var f = {}; card.querySelectorAll('[data-k]').forEach(function (x) { f[x.dataset.k] = x.value; });
      if (q.qtype === 'mcq') {
        f.choices = [0, 1, 2, 3].map(function (k) { return card.querySelector('[data-c="' + k + '"]').value.trim(); });
        f.option_notes = [0, 1, 2, 3].map(function (k) { return card.querySelector('[data-n="' + k + '"]').value.trim(); });
      }
      saveQ(i, f);
    }
  });
  ['#qStatus', '#qSub', '#qLow'].forEach(function (s) { $(s).addEventListener('change', loadBank); });

  // ---- 시작: 로그인 → 관리자 확인
  function start() {
    return api('/api/me').then(function (m) {
      me = m; $('#logoutBtn').hidden = false;
      if (!m.admin) { gate('관리자만 볼 수 있는 화면이에요. (' + m.email + ')', false); return; }
      $('#gate').hidden = true; $('#tabs').hidden = false; $('#who').textContent = (m.name || m.email) + ' · ' + ROLE[m.role] + ' · 로그인됨';
      var t = (location.hash || '').slice(1); show(['dash', 'users', 'activity', 'bank'].indexOf(t) >= 0 ? t : 'dash');
    }).catch(function (e) { gate(e.message, true); });
  }
  $('#logoutBtn').addEventListener('click', function () { sb.auth.signOut().then(function () { location.href = './'; }); });
  $('#loginBtn').addEventListener('click', function () { sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } }); });
  fetch('topics.json').then(function (r) { return r.json(); }).then(function (t) {
    topics = t;
    $('#qSub').innerHTML = '<option value="">모든 범위</option>' + t.map(function (d) { return '<optgroup label="' + esc(d.id + '. ' + d.name) + '">' + d.subs.map(function (s) { return '<option value="' + s.id + '">' + s.id + ' ' + esc(s.name) + '</option>'; }).join('') + '</optgroup>'; }).join('');
  }).catch(function () {});
  fetch('/api/config').then(function (r) { return r.json(); }).then(function (c) {
    if (!c.supabase_url || !window.supabase) { gate('아직 서버 설정(Supabase)이 끝나지 않았어요.', false); return; }
    sb = window.supabase.createClient(c.supabase_url, c.anon_key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' } });
    sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_IN' && !me) setTimeout(start, 0); });
    return sb.auth.getSession().then(function (r) {
      if (location.search.indexOf('code=') >= 0) history.replaceState(null, '', location.pathname + location.hash);
      if (r.data.session) return start();
      gate('관리자 계정으로 로그인해 주세요.', true);
    });
  }).catch(function () { gate('서버에 연결하지 못했어요.', false); });
})();
</script>
</body>
</html>
