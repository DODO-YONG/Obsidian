# TRACER 자동 시험: TRACER 코드가 바뀌어 푸시될 때마다 화면을 실제 브라우저로 눌러 본다.
# 가짜 로그인·가짜 DB·가짜 제미나이(dev/harness.py)라 Supabase·제미나이·Claude 사용량 0. 공개 저장소라 Actions 무료.
# 실패하면 Actions 화면 아래 "tracer-test-failures"에 스크린샷·trace가 남는다(trace.playwright.dev 에 끌어다 놓으면 재생).
name: tracer-test
on:
  push:
    branches: [main]
    paths:
      - "docs/ccna/**"
      - "docs/api/**"
      - "agents/ccna-coach/**"
      - ".github/workflows/tracer-test.yml"
  pull_request:
    paths:
      - "docs/ccna/**"
      - "docs/api/**"
      - "agents/ccna-coach/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/ccna-coach/e2e/requirements.txt
      - name: 로직 시험 (가짜 DB·제미나이)
        run: python agents/ccna-coach/dev/test_core.py
      - name: Playwright 설치
        run: |
          pip install -r agents/ccna-coach/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: 화면 시험
        run: pytest -q agents/ccna-coach/e2e --tracing retain-on-failure --screenshot only-on-failure --output test-results
      - name: 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracer-test-failures
          path: test-results
          retention-days: 7
