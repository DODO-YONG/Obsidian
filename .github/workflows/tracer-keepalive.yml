# TRACER: Supabase 무료 프로젝트는 일주일 동안 DB 활동이 없으면 일시정지된다.
# 하루 한 번 /api/health 를 불러 DB를 한 번 읽게 해서 막는다. (공개 저장소라 GitHub Actions 무료)
# 저장소 Settings → Secrets and variables → Actions → Variables 에 TRACER_URL(예: https://xxx.vercel.app)을 넣으면 동작.
name: tracer-keepalive
on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 (한국 시간)
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping TRACER health (reads DB once)
        env:
          TRACER_URL: ${{ vars.TRACER_URL }}
        run: |
          if [ -z "$TRACER_URL" ]; then echo "TRACER_URL 변수가 없어 건너뜀"; exit 0; fi
          for i in 1 2 3; do
            out=$(curl -fsS --max-time 30 "$TRACER_URL/api/health") && echo "$out" && echo "$out" | grep -q '"db": true' && exit 0
            sleep 20
          done
          echo "DB 응답 없음"; exit 1
